
<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocalBiz AI - Product Search</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: white;
      max-width: 420px;
      margin: 70px auto;
      padding: 30px 22px;
      border-radius: 18px;
      box-shadow: 0 8px 25px #0001;
    }
    h1 { color: #2563eb; }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border-radius: 9px;
      box-sizing: border-box;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>LocalBiz AI</h1>
    <h3>ಉತ್ಪನ್ನ ಹುಡುಕಾಟ</h3>
    <p>ನಿಮಗೆ ಬೇಕಾದ ಉತ್ಪನ್ನದ ಹೆಸರನ್ನು ಬರೆಯಿರಿ.</p>

    <form
      action="https://hook.eu1.make.com/frkvko2f14vs6kk6u7ingohk05vh28t0"
      method="GET"
      target="_blank">

      <input
        type="text"
        name="product"
        placeholder="ಉದಾ: Silk Saree"
        required>

      <button type="submit">
        ಉತ್ಪನ್ನ ಹುಡುಕಿ
      </button>
    </form>
  </div>
</body>
</html>
